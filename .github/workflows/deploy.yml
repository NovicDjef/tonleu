name: Deploy Portfolio to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '19'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build project
      run: npm run build

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          echo "🚀 Starting deployment..."

          # Variables
          APP_DIR="/var/www/tonleu"
          BACKUP_DIR="/var/www/backups"
          APP_NAME="tonleu"

          # Create directories if they don't exist
          mkdir -p $APP_DIR
          mkdir -p $BACKUP_DIR

          # Clean existing directory if git clone will fail
          if [ -d "$APP_DIR" ] && [ "$(ls -A $APP_DIR)" ]; then
            echo "📦 Creating backup..."
            cp -r $APP_DIR $BACKUP_DIR/portfolio-backup-$(date +%Y%m%d-%H%M%S) || echo "Backup failed"
            rm -rf $APP_DIR/*
            rm -rf $APP_DIR/.[^.]*
          fi

          # Clone or pull latest code
          echo "📥 Cloning repository..."
          git clone https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git $APP_DIR
          cd $APP_DIR

          # Install dependencies
          echo "📦 Installing dependencies..."
          npm install

          # Build the project
          echo "🏗️ Building project..."
          npm run build

          # Install PM2 if not installed
          if ! command -v pm2 &> /dev/null; then
            echo "📦 Installing PM2..."
            npm install -g pm2
          fi

          # Stop existing process if running
          pm2 stop $APP_NAME || echo "Process not running"
          pm2 delete $APP_NAME || echo "Process not found"

          # Start new process with preview server
          echo "🚀 Starting portfolio server..."
          pm2 start npm --name $APP_NAME -- start
          pm2 save

          # Setup PM2 startup if first time
          pm2 startup || echo "PM2 startup already configured"

          echo "✅ Deployment completed successfully!"
          echo "🌐 Portfolio should be available at: https://novic.dev"

          # Clean old backups (keep only last 5)
          cd $BACKUP_DIR
          ls -t | tail -n +6 | xargs -r rm -rf

    - name: Upload build files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        source: "dist/*"
        target: "/var/www/tonleu/"
        overwrite: true